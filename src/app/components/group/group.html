<section class="section-card">
  <div class="section-header">
    <h2>קבוצות</h2>
    <span class="pill">{{ groups.length }} קבוצות</span>
  </div>

  <div class="group-grid">
    @for (group of groups; track group.name) {
      <div class="group-box {{ group.color }}">
        <strong>{{ group.name }}</strong>
        <span>{{ countContacts(group.name) }} אנשי קשר</span>
      </div>
    } @empty {
      <p class="empty-state">אין קבוצות להצגה.</p>
    }
  </div>
</section>
