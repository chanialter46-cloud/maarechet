<article class="profile-card">
  <div class="profile-card__header">
    <div class="avatar">{{ firstName.charAt(0) }}{{ lastName.charAt(0) }}</div>
    <div>
      <h3>{{ firstName }} {{ lastName }}</h3>
      <span class="tag">{{ status ? 'פעיל' : 'לא פעיל' }}</span>
    </div>
  </div>

  <div class="detail-list">
    <div class="detail-item"><span>כיתה</span><strong>{{ classNumber }}</strong></div>
    <div class="detail-item"><span>מחזור</span><strong>{{ gradeNumber }}</strong></div>
    <div class="detail-item"><span>מסלול</span><strong>{{ subject }}</strong></div>
    <div class="detail-item"><span>מייל</span><strong>{{ email }}</strong></div>
    <div class="detail-item"><span>טלפון</span><strong>{{ phoneNumber }}</strong></div>
    <div class="detail-item"><span>כתובת</span><strong>{{ adress }}</strong></div>
  </div>
</article>
