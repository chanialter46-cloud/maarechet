<section class="section-card">
  <div class="section-header">
    <h2>אנשי קשר</h2>
    <div class="header-actions">
      <span class="contact-count">{{ contacts.length }} אנשי קשר</span>
      <button class="add-contact" type="button" (click)="create.emit()">+ הוספת איש קשר</button>
    </div>
  </div>

  @for (contact of contacts; track contact.id) {
    <app-contact
      [contact]="contact"
      [groups]="groups"
      [initialEditing]="contact.id === newContactId"
      [isNew]="contact.id === newContactId"
      (saved)="saved.emit($event)"
      (deleted)="deleted.emit($event)"
      (cancelled)="cancelled.emit($event)"
    />
  } @empty {
    <p class="empty-state">אין אנשי קשר להצגה.</p>
  }
</section>
